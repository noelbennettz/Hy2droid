# Keep the workflow actions pinned to a commit SHA (see `.github/workflows/*.yml`)
# and let Dependabot propose the bump together with the `# vN` comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # gradle/libs.versions.toml holds every dependency version. The wrapper stays
  # on its own pin; Dependabot only touches the version catalogue.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
