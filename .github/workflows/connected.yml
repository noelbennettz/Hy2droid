name: connected

# Instrumentation tests on a real Android runtime: Compose UI (settings and the
# licences screen) plus parsing on the device's own `java.net` implementation.
#
# What this does NOT cover: anything that needs a Hysteria 2 server. Packet
# forwarding, handover, the VPN consent dialog and the core itself stay manual on
# a physical device — see "Instrumentation tests" in DOCS.md.
#
# API 30 is the minSdk floor and runs on every pull request. API 37 runs on main
# only: it is the target SDK, and two emulator boots per pull request is more CI
# time than the coverage is worth.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# actions: write is for the run cleanup step at the end of each job.
permissions:
  contents: read
  actions: write

jobs:
  connected-api30:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Platform 37 can be newer than the runner image's SDK, and compileSdk 37
      # is needed before Gradle can build anything.
      - name: Install Android SDK platform 37
        run: |
          set -euo pipefail
          sdkmgr="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmgr" --licenses > /dev/null || true
          "$sdkmgr" 'platforms;android-37.0'

      # The emulator needs /dev/kvm from the runner; grant the group perms.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The APK packages libhysteria.so, so the pinned core has to be in place
      # before Gradle assembles the test APKs.
      - name: Install the pinned Hysteria core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/core.sh fetch
          bash scripts/core.sh verify

      - name: Run connected tests (API 30)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-report-api30
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune-runs.sh 3

  connected-api37:
    # Target SDK. Main and manual runs only: see the note at the top.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform 37
        run: |
          set -euo pipefail
          sdkmgr="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmgr" --licenses > /dev/null || true
          "$sdkmgr" 'platforms;android-37.0'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the pinned Hysteria core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/core.sh fetch
          bash scripts/core.sh verify

      - name: Run connected tests (API 37)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # The SDK calls this platform "android-37.0"; the action interpolates
          # both inputs into `platforms;android-<api-level>` and
          # `system-images;android-<system-image-api-level>;<target>;<arch>`.
          api-level: 37.0
          system-image-api-level: 37.0
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-report-api37
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune-runs.sh 3
