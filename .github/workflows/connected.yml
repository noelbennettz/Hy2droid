name: connected

# Instrumentation tests on a real Android runtime: Compose UI (settings and the
# licences screen) plus parsing on the device's own `java.net` implementation.
#
# What this does NOT cover: anything that needs a Hysteria 2 server. Packet
# forwarding, handover, the VPN consent dialog and the core itself stay manual on
# a physical device — see "Instrumentation tests" in DOCS.md.
#
# API 30 is the minSdk floor and runs on every pull request. The newest emulator
# image Google publishes for `google_apis` runs on main only: two emulator boots
# per pull request is more CI time than the coverage is worth, and the runner
# image lags the target SDK anyway.
#
# Why not the target SDK (37)? There is no `system-images;android-37*` system
# image and no `platforms;android-37` package (the platform is `android-37.0`),
# so `ReactiveCircus/android-emulator-runner` — which installs
# `platforms;android-<api-level>` before booting — cannot start an API 37
# emulator. API 37 behaviour is covered on a physical device, not here; see
# "Instrumentation tests" in DOCS.md.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# actions: write is for the run cleanup step at the end of each job.
permissions:
  contents: read
  actions: write

jobs:
  connected-api30:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Platform 37 can be newer than the runner image's SDK, and compileSdk 37
      # is needed before Gradle can build anything.
      - name: Install Android SDK platform 37
        run: |
          set -euo pipefail
          sdkmgr="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmgr" --licenses > /dev/null || true
          "$sdkmgr" 'platforms;android-37.0'

      # The emulator needs /dev/kvm from the runner; grant the group perms.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The APK packages libhysteria.so, so the pinned core has to be in place
      # before Gradle assembles the test APKs.
      - name: Install the pinned Hysteria core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/core.sh fetch
          bash scripts/core.sh verify

      - name: Run connected tests (API 30)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connected-report-api30
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune-runs.sh 3

  connected-api36:
    # Newest published emulator image. Main and manual runs only: see the note at
    # the top.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform 37
        run: |
          set -euo pipefail
          sdkmgr="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmgr" --licenses > /dev/null || true
          "$sdkmgr" 'platforms;android-37.0'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the pinned Hysteria core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/core.sh fetch
          bash scripts/core.sh verify

      - name: Run connected tests (API 36)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connected-report-api36
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune-runs.sh 3
