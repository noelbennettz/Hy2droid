name: release

# Production (signed) release. Runs on a version tag such as `v2.1.0`, or
# manually with an explicit version. Only a stable `<major>.<minor>.<patch>`
# version is accepted: a pre-release suffix would derive the same versionCode as
# the final release. The signed APKs are published to a GitHub
# Release; without the signing secrets the job still builds (validating R8) but
# skips publishing and says so in the log.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, e.g. 2.1.0 (published tag becomes v2.1.0)'
        required: true

permissions:
  contents: write
  # actions/attest-build-provenance signs a Sigstore statement with the workflow's
  # OIDC identity and stores it in the repository's attestation log.
  id-token: write
  attestations: write
  # For the run cleanup step at the end of the job.
  actions: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit is part of the provenance, and the version name comes from
          # the tag, so the whole history and every tag have to be here.
          fetch-depth: 0


      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            name="${{ github.ref_name }}"
            name="${name#v}"
          else
            name="${{ inputs.version_name }}"
          fi
          [ -n "$name" ] || { echo "::error::could not resolve a version name"; exit 1; }
          # A published version is exactly <major>.<minor>.<patch>. A suffix such
          # as `-rc1` would share its versionCode with the final release (`1.0.0`
          # and `1.0.0-rc1` are both 1000000), so Play refuses the second upload
          # as a duplicate. Fail here, before anything is built or published;
          # `-dev` names stay valid for local and CI builds.
          if ! release_name="$(bash scripts/version.sh release "$name")"; then
            echo "::error::release versions must be stable X.Y.Z, got '$name' — push the final tag instead of a pre-release one"
            exit 1
          fi
          name="$release_name"
          # versionCode is a pure function of the version name (scripts/version.sh),
          # so a rebuild of the same tag keeps the same, upgradeable code. The
          # workflow run number is deliberately not used: it changes on every run.
          code="$(bash scripts/version.sh code "$name")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building Hy2droid $name (versionCode $code)"

      - name: Install Hysteria core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The core is pinned in core/core.properties and nothing here can move
          # it: a release rebuild must produce the same binaries as the tag did.
          bash scripts/core.sh fetch --pinned
          bash scripts/core.sh version | tee core-version.txt

      - name: Verify bundled core
        run: bash scripts/core.sh verify

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      # Platform 37 can be newer than the runner image's SDK, so install it
      # explicitly instead of depending on the image's revision.
      - name: Install Android SDK platform 37
        run: |
          set -euo pipefail
          sdkmgr="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmgr" --licenses > /dev/null || true
          "$sdkmgr" 'platforms;android-37.0'

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p signing
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/production.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing key restored from secrets."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the release APK will be UNSIGNED and nothing will be published. Add the signing secrets (see README > Releasing)."
          fi

      - name: Build release APK and app bundle
        env:
          HY2_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HY2_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HY2_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HY2_VERSION_NAME: ${{ steps.version.outputs.name }}
          HY2_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set +e
          ./gradlew testDebugUnitTest licenseeRelease assembleRelease bundleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/release.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::Gradle release build failed (exit $rc); surfacing errors:"
            grep -E '^e: |error:|What went wrong|Caused by|> Task .* FAILED|R8: ' /tmp/release.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      - name: Verify APK signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-universal-release.apk

      # The checksums and the certificate fingerprint are what a user can check
      # locally; scripts/release-verify.sh writes SHA256SUMS.txt next to the
      # APKs and fails if they are not all signed by the same certificate.
      - name: Checksum the APKs and check their signing certificate
        id: checksums
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          out="$(bash scripts/release-verify.sh app/build/outputs/apk/release)"
          echo "Signing certificate SHA-256: ${out#Signing certificate SHA-256: }"
          echo "certificate=${out#Signing certificate SHA-256: }" >> "$GITHUB_OUTPUT"

      - name: Upload checksums
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hy2droid-release-checksums
          path: app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hy2droid-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # syft is pinned by version *and* checked against its published
      # checksums.txt: an SBOM is only worth having if the tool that wrote it is
      # the one we chose. Bump both lines together.
      - name: Install syft (pinned)
        run: |
          set -euo pipefail
          version=1.33.0
          url="https://github.com/anchore/syft/releases/download/v$version"
          out=/tmp/syft
          mkdir -p "$out"
          curl -sSfL -o "$out/syft_${version}_linux_amd64.tar.gz" \
            "$url/syft_${version}_linux_amd64.tar.gz"
          curl -sSfL -o "$out/checksums.txt" "$url/syft_${version}_checksums.txt"
          ( cd "$out" && grep ' linux_amd64.tar.gz$' checksums.txt | sha256sum -c - )
          sudo tar -xzf "$out/syft_${version}_linux_amd64.tar.gz" -C /usr/local/bin syft
          syft version

      # SPDX 2.3 for the universal APK: syft's view of the bundled Go core plus the
      # Maven artefacts from Licensee's report. Deterministic for a commit (see
      # scripts/sbom.sh), so two runs over the same tag produce the same bytes.
      - name: Generate SPDX SBOM
        run: bash scripts/sbom.sh app/build/outputs/apk/release/app-universal-release.apk

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hy2droid-release-sbom
          path: hy2droid-*.spdx.json
          if-no-files-found: error

      # A signed bundle is what Google Play accepts; the APKs above are for
      # sideloading and the GitHub release. Keeping it as a workflow artifact is
      # the whole Play pipeline: nothing here talks to the Play API, and the
      # upload to a track is a manual step (see PLAY_RELEASE.md).
      - name: Upload Play app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hy2droid-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Everything a reviewer needs to tie the artefacts back to this commit.
      # Written sorted and without the clock, so two runs over the same inputs
      # produce the same file.
      - name: Write build info
        run: |
          set -euo pipefail
          {
            echo "version=${{ steps.version.outputs.name }}"
            echo "versionCode=${{ steps.version.outputs.code }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "tag=${{ github.ref_name }}"
            echo "core=$(grep -m1 '^HYSTERIA_VERSION=' core/core.properties | cut -d= -f2)"
            echo "tun2socks=$(sed -n 's/^HEV_TAG=\"\\(.*\\)\"$/\\1/p' scripts/tun2socks.sh)"
            echo "tun2socks_sha256:"
            sort native/tun2socks/SHA256SUMS | sed 's/^/  /'
            echo "signing_certificate_sha256=${{ steps.checksums.outputs.certificate }}"
          } > BUILD-INFO.txt
          cat BUILD-INFO.txt

      # Signed provenance for the APKs and the AAB: `gh attestation verify`
      # checks that these bytes were produced by this workflow in this repository
      # from this commit, without trusting the release page.
      # actions/attest-build-provenance v2.3.0
      - name: Attest build provenance
        if: steps.signing.outputs.signed == 'true'
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd
        with:
          subject-path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/SHA256SUMS.txt
            BUILD-INFO.txt

      - name: Publish GitHub Release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          core_line="$(grep -m1 'recorded core' core-version.txt || true)"
          cat > release-notes.md <<NOTES
          Hy2droid $VERSION_NAME (versionCode $VERSION_CODE)

          - ${core_line:-Hysteria core: see build log}
          - ABI splits: arm64-v8a, armeabi-v7a, x86_64, x86 (+ universal)

          Install \`app-arm64-v8a-release.apk\` on most phones, or
          \`app-universal-release.apk\` if you are unsure. Requires Android 11+
          (minSdk 30).

          Verify your download: \`sha256sum -c SHA256SUMS.txt --ignore-missing\`
          next to the APKs, and compare the signer printed by
          \`apksigner verify --print-certs\`. See README > Verify your download.

          Provenance: \`gh attestation verify app-universal-release.apk --repo ${{ github.repository }}\`
          checks that these files were built by this workflow from this commit.
          \`BUILD-INFO.txt\` records the commit, the core version and the
          libtun2socks hashes the release was built with.

          Signing certificate SHA-256: ${{ steps.checksums.outputs.certificate }}
          NOTES

          mapfile -t files < <(ls app/build/outputs/apk/release/*.apk)
          files+=(app/build/outputs/apk/release/SHA256SUMS.txt BUILD-INFO.txt \
                  hy2droid-*.spdx.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "Hy2droid $VERSION_NAME" \
              --notes-file release-notes.md
          fi
          echo "Published https://github.com/${{ github.repository }}/releases/tag/$tag"

      # Last on purpose: keep only the newest three runs of this workflow. The
      # published releases are separate objects and survive their run.
      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune-runs.sh 3
