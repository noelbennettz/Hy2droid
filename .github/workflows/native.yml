name: native

# Rebuilds libtun2socks.so (hev-socks5-tunnel + the patches in native/tun2socks)
# with the pinned NDK and uploads the result. The binaries are committed, so this
# only runs on demand: use it to refresh them after changing a patch or bumping
# HEV_TAG in scripts/tun2socks.sh.
on:
  workflow_dispatch:

# actions: write is for the run cleanup step at the end of the job.
permissions:
  contents: read
  actions: write

jobs:
  tun2socks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Build libtun2socks.so
        run: bash scripts/tun2socks.sh build

      - name: Verify
        # Also compares the fresh binaries with native/tun2socks/SHA256SUMS, so
        # this run shows whether the committed files are reproducible from the
        # pinned sources; refresh the manifest in the same commit as the .so
        # files when a patch or HEV_TAG changes.
        run: bash scripts/tun2socks.sh verify

      - name: Show how the rebuilt binaries differ from the manifest
        if: always()
        run: |
          set -o pipefail
          bash scripts/tun2socks.sh sha256 | diff -u native/tun2socks/SHA256SUMS - || true
          git --no-pager diff --stat -- app/src/main/jniLibs native/tun2socks/SHA256SUMS || true

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libtun2socks-so
          path: |
            app/src/main/jniLibs/*/libtun2socks.so
            native/tun2socks/SHA256SUMS
          if-no-files-found: error

      # Last on purpose: keep only the newest three runs of this workflow.
      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune-runs.sh 3
