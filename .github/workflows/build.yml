name: build

on:
  push:
    branches: [ main ]
  # Pull requests run the same gates as main, so a red check is visible before
  # the merge instead of after it.
  pull_request:
  # No inputs: the core comes from core/core.properties, never from the newest
  # upstream release, so a manual run builds exactly what a pull request builds.
  workflow_dispatch:

# actions: write is for the run cleanup step at the end of the job.
permissions:
  contents: read
  actions: write

jobs:
  # A pull request that only edits prose does not need R8 to run. This job decides
  # that, and the release-variant job below skips itself when the answer is "docs
  # only". Everything else — the debug build, unit tests, lint, the licence and
  # locale checks — still runs on every pull request.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decide whether this change can affect the app
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request ($EVENT_NAME): building everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qvE '^(README\.md|DOCS\.md|CONTRIBUTING\.md|SECURITY\.md|LICENSE|NOTICE|screenshots/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change: skipping the release-variant build."
          fi

  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # scripts/version.sh derives versionName/versionCode from the tags;
          # a shallow clone has none, so the debug APK would report 0.0.0-dev.
          # The history here is small, and this also gives the consistency check
          # the same tags a developer sees.
          fetch-depth: 0


      # .editorconfig is not enforced by anything at build time; this is the
      # gate that keeps whitespace and import order from drifting.
      - name: Check code style
        run: bash scripts/check-style.sh

      # The two native components are not Maven artefacts, so nothing else checks
      # their licence texts. This compares native/LICENSES.tsv with the assets the
      # app shows, with NOTICE, and with the versions in core.properties and
      # scripts/tun2socks.sh.
      - name: Check native component licences
        run: bash scripts/check-native-licences.sh

      # Every values-*/strings.xml has to carry the same key set: a translation
      # that lost a key shows English, and a key the default file does not have
      # is usually a rename that only touched one side. Lint's
      # MissingTranslation is disabled, so this is the coverage gate.
      - name: Check locale parity
        run: bash scripts/check-locales.sh

      # README/DOCS say which release they describe, and the core badge says
      # which core is pinned. This keeps a release note, a tag and the docs from
      # drifting apart; it needs no Gradle, so it fails fast.
      - name: Check docs and version consistency
        run: |
          bash scripts/check-version-consistency.sh
          bash scripts/check-docs.sh

      # The versionCode is a pure function of the version name, so a pre-release
      # suffix (`v1.0.0-rc1`) would collide with the final release. This asserts
      # that `release.yml` refuses one before it builds.
      - name: Check the release version guard
        run: bash scripts/check-release-version.sh

      # Licensee fails the build when a dependency is under a licence that is
      # not allowed in app/build.gradle. The same task produces the report the
      # in-app licences screen shows, so this also guards that screen's data.
      - name: Check dependency licences
        run: ./gradlew licenseeRelease --no-daemon --console=plain

      # The core is pinned by core/core.properties (version + per-ABI SHA-256).
      # `fetch --pinned` ignores HY2_CORE_TAG on purpose: a build must not pick up
      # a different core because the environment says so. Moving the pin is a
      # reviewable change to that file, made by `scripts/core.sh upgrade <tag>`.
      - name: Install Hysteria core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/core.sh fetch --pinned
          {
            echo "### Hysteria core"
            echo '```'
            bash scripts/core.sh version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify bundled core
        run: bash scripts/core.sh verify

      - name: Verify tun2socks binaries
        # Checks native/tun2socks/SHA256SUMS, the JNI entry points and 16 KB
        # alignment on all four ABIs. A changed .so with an unchanged manifest
        # fails here.
        run: bash scripts/tun2socks.sh verify

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      # Caches ~/.gradle/caches and the build cache between runs, and writes a
      # summary of what was restored. This is where most of the CI time used to
      # go: every run re-resolved every dependency.
      # gradle/actions/setup-gradle v4.4.3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      # Platform 37 can be newer than the runner image's SDK, so install it
      # explicitly instead of depending on the image's revision.
      - name: Install Android SDK platform 37
        run: |
          set -euo pipefail
          sdkmgr="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmgr" --licenses > /dev/null || true
          "$sdkmgr" 'platforms;android-37.0'

      - name: Build debug APK
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::Gradle build failed (exit $rc); surfacing compiler errors:"
            grep -E '^e: |error:|What went wrong|Caused by|> Task .* FAILED' /tmp/build.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      - name: Lint
        run: |
          set +e
          ./gradlew lintDebug --no-daemon --console=plain 2>&1 | tee /tmp/lint.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::Lint reported errors (exit $rc):"
            grep -E 'Error: |error: ' /tmp/lint.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hy2droid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Last on purpose: keep the Actions tab and the artifact quota small by
      # deleting every run of this workflow older than the newest three.
      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune-runs.sh 3

  # The release variant is where R8, resource shrinking and the JNI keep rules
  # fail, so it has to run before a tag — but not for a pull request that only
  # touched prose. Everything here mirrors release.yml except the signing step,
  # which is exactly the part CI cannot reproduce without the keystore secrets.
  unsigned-release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      # gradle/actions/setup-gradle v4.4.3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install Android SDK platform 37
        run: |
          set -euo pipefail
          sdkmgr="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmgr" --licenses > /dev/null || true
          "$sdkmgr" 'platforms;android-37.0'

      - name: Install Hysteria core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/core.sh fetch --pinned
          bash scripts/core.sh verify

      - name: Build release APK and app bundle (unsigned)
        run: |
          set +e
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/release.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::Gradle release build failed (exit $rc); surfacing R8 errors:"
            grep -E '^e: |error:|What went wrong|Caused by|> Task .* FAILED|R8: ' /tmp/release.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi
