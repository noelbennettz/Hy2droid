# Gradle daemon JVM. Lint and R8 both need room; 2 GB is enough for a single module.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
# Each library's R class carries only its own resources, which keeps the app's
# R class small without any call-site change.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Reuse task outputs across builds and across CI runs (gradle/actions/setup-gradle
# persists this directory). The configuration cache is deliberately *not* enabled:
# versionName/versionCode come from `git describe` inside scripts/version.sh, and
# a cached configuration would not notice a new tag — it would happily rebuild the
# previous versionCode.
org.gradle.caching=true
