plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    id 'app.cash.licensee' version '1.14.1'
}

licensee {
    allow('Apache-2.0')
    allow('MIT')
    allow('BSD-2-Clause')
    allow('BSD-3-Clause')
    allow('ISC')
}

// Version numbers come from scripts/version.sh, the single source both locally
// and in CI: the name is the git tag (nearest tag + `-dev.<n>+g<sha>` when HEAD
// is not tagged, `0.0.0-dev` without git), and the code is a pure function of
// that name (major*1_000_000 + minor*1_000 + patch), so rebuilding the same
// commit cannot produce a different, non-upgradeable versionCode. An explicit
// -P flag or HY2_VERSION_NAME/HY2_VERSION_CODE still wins; a workflow_dispatch
// release needs that, because there is no tag to read.
def versionScript = rootProject.file('scripts/version.sh')
def scriptOutput = { List<String> args ->
    providers.exec {
        commandLine(['bash', versionScript.absolutePath] + args)
        workingDir rootProject.projectDir
    }.standardOutput.asText.get().trim()
}

def appVersionName = (project.findProperty('versionName')
        ?: System.getenv('HY2_VERSION_NAME')
        ?: scriptOutput(['name'])).toString()
def appVersionCode = (project.findProperty('versionCode')
        ?: System.getenv('HY2_VERSION_CODE')
        ?: scriptOutput(['code', appVersionName])).toString().toInteger()

// Keystore location: CI restores the signing key to signing/production.jks
// (gitignored), an explicit path can be given through HY2_KEYSTORE_FILE.
def keystoreFile = file(System.getenv('HY2_KEYSTORE_FILE')
        ?: rootProject.file('signing/production.jks').absolutePath)

android {
    namespace 'us.leaf3stones.hy2droid'
    compileSdk 37

    defaultConfig {
        applicationId "us.leaf3stones.hy2droid"
        minSdk 30
        targetSdk 37
        versionCode appVersionCode
        versionName appVersionName

        // Instrumentation tests (app/src/androidTest) render real screens on an
        // emulator; see .github/workflows/connected.yml. JVM unit tests stay in
        // app/src/test and need no device.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }

        // The tunnel engine's upstream tag, taken from the script that rebuilds
        // libtun2socks.so so the licences screen cannot drift from the binary
        // that is committed. Unknown only breaks the label, never the build.
        def hevTagLine = rootProject.file('scripts/tun2socks.sh').readLines()
                .find { it.startsWith('HEV_TAG=') }
        def hevTag = hevTagLine?.replaceAll(/^HEV_TAG="?/, '')?.replaceAll(/"$/, '') ?: 'unknown'
        buildConfigField "String", "TUN2SOCKS_VERSION", "\"$hevTag\""
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    signingConfigs {
        // A committed debug key, so CI artefacts and local builds share one
        // signature and install over each other. Android's stock debug key is
        // just as public; the point is that it does not change from run to run.
        debug {
            storeFile rootProject.file('app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // SECURITY: keystore + passwords are NEVER committed to version control.
            // Provide them locally via gradle properties (e.g. ~/.gradle/gradle.properties
            // or -P flags) or environment variables before building a release.
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword(System.getenv("HY2_KEYSTORE_PASSWORD") ?: project.findProperty("HY2_KEYSTORE_PASSWORD"))
                keyAlias(System.getenv("HY2_KEY_ALIAS") ?: project.findProperty("HY2_KEY_ALIAS") ?: "signing")
                keyPassword(System.getenv("HY2_KEY_PASSWORD") ?: project.findProperty("HY2_KEY_PASSWORD"))
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        // The Hysteria core is exec'd straight from nativeLibraryDir, so the
        // libraries must be extracted to disk. AGP 9 rejects the manifest
        // attribute and wants it here instead.
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // CI runs `lintDebug`: lint errors fail the build, warnings stay warnings.
    // Translation coverage is checked by the i18n script instead (it compares the
    // key sets across all locales, which lint cannot do).
    lint {
        abortOnError = true
        warningsAsErrors = false
        disable 'MissingTranslation'
    }
}

// The Hysteria core binaries are downloaded at build time instead of being
// committed (see scripts/core.sh + core/core.properties). This task is a no-op
// when the pinned binaries are already present and match their checksums.
tasks.register('fetchCore', Exec) {
    group = 'build setup'
    description = 'Download the pinned Hysteria core into app/src/main/jniLibs'
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/core.sh').absolutePath, 'fetch'
}

tasks.named('preBuild').configure { dependsOn 'fetchCore' }

// Licensee's report is JSON produced on the build machine; the app reads a
// tab-separated copy so parsing at runtime needs no JSON library.
def licenseeReport = layout.buildDirectory.file('reports/licensee/androidRelease/artifacts.json')
def licenseeAssetsDir = layout.buildDirectory.dir('generated/licenseeAssets')
android.sourceSets.main.assets.srcDir(new File(licenseeAssetsDir.get().asFile.path))

tasks.register('licenseeAssets') {
    group = 'build setup'
    description = 'Copy the Licensee report into the app assets as plain text'
    dependsOn 'licenseeAndroidRelease'
    inputs.file(licenseeReport)
    outputs.dir(licenseeAssetsDir)
    doLast {
        def report = new groovy.json.JsonSlurper().parse(licenseeReport.get().asFile)
        def rows = report.collect { dependency ->
            def id = dependency.spdxLicenses ? dependency.spdxLicenses*.identifier.join(', ') : 'unknown'
            "${dependency.groupId}:${dependency.artifactId}\t${dependency.version}\t${id}"
        }.unique().sort()
        def out = licenseeAssetsDir.get().dir('licenses').asFile
        out.mkdirs()
        new File(out, 'android-dependencies.txt').text = rows.join('\n') + '\n'
    }
}

tasks.named('preBuild').configure { dependsOn 'licenseeAssets' }


dependencies {
    implementation libs.androidx.datastore.preferences

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation(libs.androidx.lifecycle.viewmodel.compose)

    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material.icons.extended
    implementation libs.zxing.core
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    testImplementation libs.junit
    // Only previews need the tooling artefact, and only in debug builds.
    debugImplementation libs.androidx.ui.tooling

    // Instrumentation tests: Compose UI on a device/emulator plus the AndroidX
    // test runner. ui-test-manifest supplies the empty ComponentActivity that
    // createComposeRule() hosts the content in, so it is debug-only.
    androidTestImplementation libs.junit
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.test.manifest
}
